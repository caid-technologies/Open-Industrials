name: Headless physics and replay
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  physics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/physics/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -r tools/physics/requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests/physics -v
      - run: npm run test:physics-protocol
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:physics-browser
        env:
          PHYSICS_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-${{ matrix.os }}
          path: test-results/physics-*.png
          if-no-files-found: ignore
